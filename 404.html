<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050707">
<title>Nokiatis MUC — Shared with you</title>
<link rel="icon" href="/nokiatis-muc-updates/images/icon.jpg">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    background:#050707; color:#EDF2EE; min-height:100svh; display:flex; align-items:center; justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; padding:22px;
    background-image:radial-gradient(700px 420px at 50% -10%, rgba(34,197,94,.18), transparent 62%);
  }
  .card {
    width:min(440px,100%); text-align:center; background:linear-gradient(180deg,#151E1A,#101713);
    border:1px solid rgba(255,255,255,.1); border-radius:30px; padding:36px 26px 28px;
    box-shadow:0 34px 80px rgba(0,0,0,.55), 0 0 80px rgba(34,197,94,.1);
  }
  img.icon { width:96px; height:96px; border-radius:26px; box-shadow:0 20px 44px rgba(0,0,0,.55); }
  .brand { margin-top:16px; font-size:11px; letter-spacing:3px; font-weight:800; color:#86EFAC; }
  h1 { font-size:clamp(22px,6vw,29px); font-weight:900; line-height:1.3; margin:10px 0 8px; }
  p { color:#A8B3AD; font-size:15px; line-height:1.65; }
  .name { color:#EDF2EE; font-weight:800; word-break:break-word; }
  .count { display:inline-block; margin-top:10px; background:rgba(34,197,94,.14); border:1px solid rgba(34,197,94,.4);
    color:#C9F5D9; border-radius:999px; padding:5px 13px; font-size:12.5px; font-weight:700; }
  .btn {
    display:flex; align-items:center; justify-content:center; gap:9px; width:100%; min-height:54px; margin-top:14px;
    background:#22C55E; color:#04120A; font-weight:800; font-size:16px; text-decoration:none; border-radius:999px;
    box-shadow:0 14px 34px rgba(34,197,94,.35);
  }
  .btn.ghost { background:rgba(255,255,255,.06); color:#EDF2EE; border:1px solid rgba(255,255,255,.12); box-shadow:none; }
  .hint { margin-top:16px; font-size:12.5px; color:#7C8A83; }
  .foot { margin-top:20px; font-size:11.5px; color:#5F6D66; letter-spacing:1.6px; font-weight:700; }
</style>
</head>
<body>
  <main class="card">
    <img class="icon" id="iconImg" src="/nokiatis-muc-updates/images/icon.jpg" alt="Nokiatis MUC">
    <div class="brand">NOKIATIS MUC</div>
    <h1 id="title">Shared with you</h1>
    <p id="desc">Open it in Nokiatis MUC to listen right away.</p>
    <div><span class="count" id="count" hidden></span></div>
    <a class="btn" id="openBtn" href="#">▶ <span id="openTxt">Open in Nokiatis MUC</span></a>
    <a class="btn ghost" id="siteBtn" href="/nokiatis-muc-updates/">⬇ <span id="siteTxt">Don't have it? Get the free app</span></a>
    <p class="hint" id="hint">If the app is installed, the first button opens it directly on what was shared.</p>
    <div class="foot">TEAM NOKIATIS</div>
  </main>

<script>
(function () {
  var STR = {
    en: {
      song: 'A song was shared with you',
      playlist: 'A playlist was shared with you',
      songs: function (n) { return '🎶 ' + n + (n === 1 ? ' song' : ' songs'); },
      desc: 'Open it in Nokiatis MUC to listen right away.',
      openTxt: 'Open in Nokiatis MUC',
      siteTxt: "Don't have it? Get the free app",
      hint: 'If the app is installed, the first button opens it directly on what was shared.',
      notfound: 'Page not found',
      nfDesc: 'This link does not look like a Nokiatis MUC share link. Head to the official website instead.',
      nfSite: 'Go to the official website'
    },
    ar: {
      song: 'تمت مشاركة أغنية معك',
      playlist: 'تمت مشاركة قائمة تشغيل معك',
      songs: function (n) { return '🎶 ' + n + ' أغنية'; },
      desc: 'افتحها في Nokiatis MUC للاستماع فورًا.',
      openTxt: 'افتح في Nokiatis MUC',
      siteTxt: 'ليس عندك التطبيق؟ حمّله مجانًا',
      hint: 'إذا كان التطبيق مثبّتًا، الزر الأول يفتحه مباشرة على ما تمت مشاركته.',
      notfound: 'الصفحة غير موجودة',
      nfDesc: 'هذا الرابط لا يبدو كرابط مشاركة من Nokiatis MUC. توجّه إلى الموقع الرسمي بدلًا من ذلك.',
      nfSite: 'اذهب إلى الموقع الرسمي'
    }
  };
  var saved = null;
  try { saved = localStorage.getItem('nk-lang'); } catch (e) {}
  var lang = saved || (((navigator.language || 'en').toLowerCase().indexOf('ar') === 0) ? 'ar' : 'en');
  var S = STR[lang] || STR.en;
  if (lang === 'ar') { document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl'; }

  var base = location.pathname.indexOf('/nokiatis-muc-updates/') === 0 ? '/nokiatis-muc-updates/' : '/';
  document.getElementById('iconImg').src = base + 'images/icon.jpg';
  document.getElementById('siteBtn').href = base;

  var title = document.getElementById('title');
  var desc = document.getElementById('desc');
  var count = document.getElementById('count');
  var openBtn = document.getElementById('openBtn');
  document.getElementById('openTxt').textContent = S.openTxt;
  document.getElementById('siteTxt').textContent = S.siteTxt;
  document.getElementById('hint').textContent = S.hint;
  desc.textContent = S.desc;

  var deep = null;
  var songMatch = location.pathname.match(/\/s\/([A-Za-z0-9_-]{6,20})\/?$/);
  var playlistMatch = location.pathname.match(/\/p\/([^/?#\s]+)\/?$/);

  function decodeBase64Url(enc) {
    try {
      var b64 = enc.replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4) b64 += '=';
      var binary = atob(b64);
      var bytes = Uint8Array.from(binary, function (c) { return c.charCodeAt(0); });
      return new TextDecoder('utf-8').decode(bytes);
    } catch (e) { return null; }
  }

  if (songMatch) {
    title.textContent = S.song;
    deep = 'nokiatismuc://song/' + songMatch[1];
  } else if (playlistMatch) {
    title.textContent = S.playlist;
    deep = 'nokiatismuc://playlist/' + playlistMatch[1];
    var json = decodeBase64Url(playlistMatch[1]);
    if (json) {
      try {
        var data = JSON.parse(json);
        if (data && data.t) {
          title.innerHTML = '';
          var span = document.createElement('span');
          span.className = 'name';
          span.textContent = String(data.t);
          title.appendChild(span);
        }
        if (data && Array.isArray(data.s) && data.s.length) {
          count.hidden = false;
          count.textContent = S.songs(data.s.length);
        }
      } catch (e) {}
    }
  } else {
    title.textContent = S.notfound;
    desc.textContent = S.nfDesc;
    openBtn.style.display = 'none';
    document.getElementById('siteTxt').textContent = S.nfSite;
    document.getElementById('hint').style.display = 'none';
  }

  if (deep) {
    openBtn.href = deep;
    // Android with the app installed usually never sees this page (App Links
    // open the app directly). If the browser landed here anyway, try the
    // scheme once — the buttons remain as the manual path.
    if (/Android/i.test(navigator.userAgent)) {
      setTimeout(function () { try { location.href = deep; } catch (e) {} }, 650);
    }
  }
})();
</script>
</body>
</html>
